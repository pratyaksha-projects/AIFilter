<!DOCTYPE html>
<html>
<head>
    <title>AIFilter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 300px;
            padding: 15px;
            background: #f5f5f5;
        }
        h2 {
            text-align: center;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            background: black;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
        }
        #result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }
        .low {
            background: #d4edda;
            color: #155724;
        }
        .medium {
            background: #fff3cd;
            color: #856404;
        }
        .high {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h2>AIFilter</h2>
    <button id="scanBtn">
        Scan Page
    </button>
    <div id="result">
        click to scan the page
    </div>
    <script src="popup.js"></script>
</body>
</html>
