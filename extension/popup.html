<!DOCTYPE html>
<html>
<head>
    <title>AIFilter</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            width: 320px;
            margin: 0;
            padding: 16px;
            background: #16213e;
            color: #d8e4f0;
        }
        h2 {
            text-align: center;
            margin: 0 0 14px;
            color: #9be564;
            letter-spacing: 0.5px;
        }

        /* Toggle row */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 14px;
            background: #1c2b4d;
            padding: 10px 12px;
            border-radius: 8px;
        }
        .switch {
            position: relative;
            width: 38px;
            height: 21px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            inset: 0;
            background: #3a4a70;
            border-radius: 999px;
            cursor: pointer;
            transition: 0.2s;
        }
        .slider::before {
            content: "";
            position: absolute;
            height: 15px; width: 15px;
            left: 3px; top: 3px;
            background: #d8e4f0;
            border-radius: 50%;
            transition: 0.2s;
        }
        input:checked + .slider { background: #2ecfae; }
        input:checked + .slider::before { background: #0f172a; transform: translateX(17px); }

        /* Big blocked count */
        .count-box {
            background: #0f1729;
            border: 1px solid #2a3a5f;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            margin-bottom: 14px;
        }
        .count-number {
            font-size: 34px;
            font-weight: bold;
            line-height: 1;
            color: #9be564;
        }
        .count-label {
            font-size: 12px;
            color: #7a8aad;
            margin-top: 4px;
        }

        /* Blocked items list */
        .list-title {
            font-size: 11px;
            font-weight: bold;
            color: #7a8aad;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        #blockedList {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 14px;
            border-radius: 8px;
            background: #0f1729;
            border: 1px solid #2a3a5f;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            font-size: 12px;
            border-bottom: 1px solid #1e2c4d;
            color: #c3d0e6;
        }
        .item:last-child { border-bottom: none; }
        .item-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 8px;
        }
        .item-score {
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
        }
        .low { background: #1e3d2f; color: #6fdb9c; }
        .medium { background: #4a3a14; color: #f0c05a; }
        .high { background: #4a1f24; color: #f0797f; }

        .empty-list {
            padding: 14px;
            text-align: center;
            font-size: 12px;
            color: #566a8b;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            background: #2ecfae;
            color: #0f1729;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s ease;
        }
        button:hover { background: #3ee0bd; }

        /* Result modal */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 10, 25, 0.6);
            align-items: center;
            justify-content: center;
        }
        .overlay.show { display: flex; }
        .modal {
            background: #16213e;
            border: 1px solid #2a3a5f;
            border-radius: 10px;
            padding: 20px;
            width: 250px;
            text-align: center;
            color: #d8e4f0;
        }
        .modal-score {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
            padding: 8px;
            border-radius: 8px;
        }
        .modal-close {
            margin-top: 10px;
            background: #2a3a5f;
            color: #d8e4f0;
        }
        .modal-close:hover { background: #34456e; }
    </style>
</head>
<body>
    <h2>AIFilter</h2>

    <div class="toggle-row">
        <span>Auto-filter feed</span>
        <label class="switch">
            <input type="checkbox" id="toggle" />
            <span class="slider"></span>
        </label>
    </div>

    <div class="count-box">
        <div class="count-number" id="countNumber">0</div>
        <div class="count-label">AI items blocked on this page</div>
    </div>

    <div class="list-title">Recently blocked</div>
    <div id="blockedList">
        <div class="empty-list">Nothing blocked yet</div>
    </div>

    <div class="btn-row">
        <button id="scanTextBtn">Scan Text</button>
        <button id="scanImageBtn">Scan Image</button>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <div id="modalTitle">Scanning...</div>
            <div class="modal-score" id="modalScore"></div>
            <button class="modal-close" id="closeModal">Close</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
